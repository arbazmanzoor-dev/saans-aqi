<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F5241; } a:hover { color: #143A2E; }
    .num { font-family: 'Instrument Serif', Georgia, serif; font-variant-numeric: tabular-nums; }
    .body { font-family: 'Karla', 'Helvetica Neue', sans-serif; }
    .eyebrow { font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 600;
               letter-spacing: 0.14em; text-transform: uppercase; }
    .mo { cursor: pointer; border: 0; background: none; padding: 0;
          display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .yr { cursor: pointer; border: 0; background: none; font-family: 'Karla', sans-serif; }
  </style>
</helmet>

<div class="body" style="width: 390px; height: 844px; background: {{t.bg}}; color: {{t.ink}};
            display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: baseline; justify-content: space-between;
              padding: 28px 24px 20px;">
    <span class="num" style="font-size: 27px;">Forecast</span>
    <div style="display: flex; gap: 2px; border: 1px solid {{t.rule}}; border-radius: 999px; padding: 3px;">
      <sc-for list="{{ years }}" as="y" hint-placeholder-count="3">
        <button class="yr" onClick="{{ y.pick }}"
                style="padding: 7px 15px; border-radius: 999px; font-size: 12.5px;
                       font-weight: {{ y.weight }}; background: {{ y.bg }}; color: {{ y.color }};">{{ y.label }}</button>
      </sc-for>
    </div>
  </div>

  <!-- the reading for the scrubbed month -->
  <div style="padding: 6px 24px 0; text-align: center;">
    <div class="eyebrow" style="color: {{t.muted}};">{{ heading }}</div>
    <div class="num" style="font-size: 96px; line-height: 0.84; margin-top: 14px;
                color: {{ band.color }};">{{ value }}</div>
    <div class="eyebrow" style="color: {{t.ink}}; margin-top: 12px;">{{ band.label }}</div>

    <!-- what the model is unsure about -->
    <div style="margin: 22px auto 0; max-width: 268px;">
      <div style="position: relative; height: 3px; background: {{t.rule}}; border-radius: 2px;">
        <div style="position: absolute; top: 0; bottom: 0; left: {{ ci.left }}; width: {{ ci.width }};
                    background: {{ band.color }}; opacity: 0.28; border-radius: 2px;"></div>
        <div style="position: absolute; top: -3px; left: {{ ci.mid }}; width: 2px; height: 9px;
                    background: {{ band.color }}; border-radius: 1px;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 9px;">
        <span style="font-size: 11px; color: {{t.faint}};">{{ ci.lo }}</span>
        <span style="font-size: 11px; color: {{t.muted}};">likely range</span>
        <span style="font-size: 11px; color: {{t.faint}};">{{ ci.hi }}</span>
      </div>
    </div>
  </div>

  <!-- scrub the year -->
  <div style="padding: 30px 18px 0;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 120px;">
      <sc-for list="{{ months }}" as="m" hint-placeholder-count="12">
        <button class="mo" onClick="{{ m.pick }}" style="flex: 1;">
          <span style="display: block; width: 100%; max-width: 15px; height: {{ m.h }};
                       border-radius: 2px; background: {{ m.color }}; opacity: {{ m.op }};"></span>
          <span style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em;
                       color: {{ m.labelColor }};">{{ m.label }}</span>
        </button>
      </sc-for>
    </div>
    <p style="margin: 16px 6px 0; font-size: 12.5px; line-height: 1.5; color: {{t.muted}};
              text-align: center;">Tap a month to read it. Bars are the modelled monthly mean.</p>
  </div>

  <div style="height: 1px; background: {{t.rule}}; margin: 24px 24px 0;"></div>

  <div style="padding: 20px 24px 0;">
    <p class="num" style="margin: 0; font-size: 19px; line-height: 1.45; text-wrap: pretty;">{{ note }}</p>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; border-top: 1px solid {{t.rule}}; padding: 10px 8px 22px;">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
                  padding: 8px 0; color: {{ n.color }};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="{{ n.icon }}"></path>
        </svg>
        <span style="font-size: 10.5px; font-weight: {{ n.weight }};">{{ n.label }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { month: 10, year: 1 }; }

  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#14120F', ink: '#F2EDE4', muted: '#9A9186', faint: '#5D564D', rule: '#2E2A24' }
      : { bg: '#FAF7F1', ink: '#1B1815', muted: '#6E675C', faint: '#ADA496', rule: '#E7E0D4' };

    const bands = [
      { max: 50, label: 'Good', light: '#2E7D4F', dark: '#4FA873' },
      { max: 100, label: 'Satisfactory', light: '#6B9A2E', dark: '#93BF47' },
      { max: 200, label: 'Moderate', light: '#D4881A', dark: '#E5A63F' },
      { max: 300, label: 'Poor', light: '#DB5F22', dark: '#EA7B42' },
      { max: 400, label: 'Very Poor', light: '#C32A22', dark: '#DE5049' },
      { max: 9999, label: 'Severe', light: '#7B1D57', dark: '#B85088' },
    ];
    const bandFor = (v) => {
      const b = bands.find((x) => v <= x.max);
      return { label: b.label, color: dark ? b.dark : b.light };
    };

    /* This project's own ensemble output, straight from ml_lookup.json. */
    const table = {
      2025: [272, 190, 160, 122, 128, 119, 92, 94, 96, 169, 302, 206],
      2026: [324, 240, 194, 204, 191, 163, 94, 97, 100, 212, 362, 326],
      2027: [322, 240, 194, 204, 191, 163, 94, 97, 100, 212, 362, 326],
    };
    const yearList = [2025, 2026, 2027];
    const year = yearList[this.state.year];
    const vals = table[year];
    const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const full = ['January','February','March','April','May','June','July','August',
                  'September','October','November','December'];

    const sel = this.state.month;
    const value = vals[sel];
    const band = bandFor(value);
    const peak = Math.max.apply(null, vals);

    const months = vals.map((v, i) => ({
      label: names[i],
      h: Math.round(14 + (v / peak) * 96) + 'px',
      color: bandFor(v).color,
      op: i === sel ? '1' : '0.3',
      labelColor: i === sel ? t.ink : t.faint,
      pick: () => this.setState({ month: i }),
    }));

    /* Walk-forward error is 18.4%, so the interval is ±1.96 × that. */
    const spread = Math.round(value * 0.184 * 1.96);
    const lo = Math.max(0, value - spread), hi = value + spread;
    const scaleLo = 0, scaleHi = 500;
    const pct = (v) => ((v - scaleLo) / (scaleHi - scaleLo)) * 100;

    return {
      t, value, band,
      heading: full[sel] + ' ' + year,
      months,
      years: yearList.map((y, i) => ({
        label: String(y),
        bg: i === this.state.year ? t.ink : 'transparent',
        color: i === this.state.year ? t.bg : t.muted,
        weight: i === this.state.year ? '600' : '500',
        pick: () => this.setState({ year: i }),
      })),
      ci: { lo: lo, hi: hi,
            left: pct(lo).toFixed(1) + '%',
            width: (pct(hi) - pct(lo)).toFixed(1) + '%',
            mid: pct(value).toFixed(1) + '%' },
      note: sel === 10
        ? 'November is the worst month of the Delhi year, every year since records here begin — roughly four times August.'
        : 'Modelled from the seasonal shape of the last five complete years, held against a flat level trend.',
      nav: [
        { label: 'Today', color: t.muted, weight: '500', icon: 'M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z' },
        { label: 'Forecast', color: t.ink, weight: '600', icon: 'M3 16h5m-5 4h9M6 12a4 4 0 0 1 .8-7.9 5.5 5.5 0 0 1 10.4 1.4A3.8 3.8 0 0 1 20 12' },
        { label: 'Ask', color: t.muted, weight: '500', icon: 'M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1 1 21 12z' },
        { label: 'Patterns', color: t.muted, weight: '500', icon: 'M4 19V9m5 10V5m5 14v-7m5 7V8' },
      ],
    };
  }
}
</script>
</body>
</html>
