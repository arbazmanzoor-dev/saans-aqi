<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F5241; text-decoration: none; }
    a:hover { color: #143A2E; }
    .num { font-family: 'Instrument Serif', Georgia, serif; font-variant-numeric: tabular-nums; }
    .body { font-family: 'Karla', 'Helvetica Neue', sans-serif; }
    .eyebrow { font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 600;
               letter-spacing: 0.14em; text-transform: uppercase; }
    .daycol { cursor: pointer; border: 0; background: none; padding: 6px 0 8px;
              border-radius: 10px; transition: background 140ms ease; }
    .daycol:hover { background: rgba(31,82,65,0.06); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: {{t.bg}}; color: {{t.ink}};
            display: flex; flex-direction: column; overflow: hidden;" class="body">

  <!-- masthead -->
  <div style="display: flex; align-items: baseline; justify-content: space-between;
              padding: 28px 24px 18px;">
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <span class="num" style="font-size: 27px; letter-spacing: -0.01em;">Saans</span>
      <span class="eyebrow" style="color: {{t.muted}};">AQI</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <button onClick="{{ toggleDark }}" style="width: 44px; height: 44px; border: 0; background: none;
              cursor: pointer; display: flex; align-items: center; justify-content: center;
              color: {{t.muted}}; border-radius: 999px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="{{t.themeIcon}}"></path>
        </svg>
      </button>
      <div style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid {{t.rule}};
                  display: flex; align-items: center; justify-content: center;
                  font-size: 12px; font-weight: 600; color: {{t.muted}};">A</div>
    </div>
  </div>

  <!-- the reading -->
  <div style="padding: 0 24px;">
    <div style="position: relative; display: flex; justify-content: center;">
      <svg width="280" height="168" viewBox="0 0 280 168" style="display: block;">
        <sc-for list="{{ segs }}" as="seg" hint-placeholder-count="6">
          <path d="{{seg.d}}" fill="none" stroke="{{seg.color}}" stroke-width="7"
                stroke-linecap="butt" opacity="{{seg.op}}"></path>
        </sc-for>
        <line x1="{{ mark.x1 }}" y1="{{ mark.y1 }}" x2="{{ mark.x2 }}" y2="{{ mark.y2 }}"
              stroke="{{ band.color }}" stroke-width="2.5" stroke-linecap="round"></line>
        <circle cx="{{ mark.cx }}" cy="{{ mark.cy }}" r="5.5" fill="{{ t.card }}"
                stroke="{{ band.color }}" stroke-width="2.5"></circle>
      </svg>
      <div style="position: absolute; top: 62px; left: 0; right: 0; text-align: center;">
        <div class="num" style="font-size: 74px; line-height: 0.86; color: {{t.ink}};">{{ value }}</div>
        <div class="eyebrow" style="color: {{ band.color }}; margin-top: 10px;">{{ band.label }}</div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; margin-top: 2px;">
      <span class="eyebrow" style="color: {{t.faint}};">0</span>
      <span class="eyebrow" style="color: {{t.faint}};">500</span>
    </div>
  </div>

  <!-- the advice, as prose -->
  <div style="padding: 22px 24px 0;">
    <p class="num" style="margin: 0; font-size: 21px; line-height: 1.42; color: {{t.ink}};
              text-wrap: pretty;">{{ advice }}</p>
    <p style="margin: 10px 0 0; font-size: 12.5px; line-height: 1.5; color: {{t.muted}};">{{ basis }}</p>
  </div>

  <sc-if value="{{ hasWarnings }}" hint-placeholder-val="{{ false }}">
    <div style="margin: 22px 24px 0; border: 1px solid {{t.rule}}; border-radius: 4px;
                overflow: hidden;">
      <div class="eyebrow" style="padding: 13px 17px 11px; color: {{ band.color }};
                  border-bottom: 1px solid {{t.rule}};">{{ warnHead }}</div>
      <sc-for list="{{ warnings }}" as="w" hint-placeholder-count="3">
        <div style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 17px;
                    border-top: 1px solid {{t.rule}};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ band.color }}"
               stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
               style="flex: none; margin-top: 1px;"><path d="{{ w.icon }}"></path></svg>
          <span style="font-size: 13px; line-height: 1.45;">{{ w.text }}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="height: 1px; background: {{t.rule}}; margin: 22px 24px 0;"></div>

  <!-- seven days -->
  <div style="padding: 16px 20px 0;">
    <div class="eyebrow" style="color: {{t.muted}}; padding: 0 4px 12px;">The week ahead</div>
    <div style="display: flex; gap: 2px;">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <button class="daycol" onClick="{{ d.pick }}"
                style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 9px;
                       background: {{ d.selBg }};">
          <span style="font-size: 11px; font-weight: 600; color: {{ d.labelColor }};">{{ d.label }}</span>
          <span style="display: block; width: 5px; height: {{ d.barH }}; border-radius: 3px;
                       background: {{ d.color }}; opacity: {{ d.barOp }};"></span>
          <span class="num" style="font-size: 17px; color: {{ d.numColor }};">{{ d.aqi }}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- stations -->
  <div style="padding: 20px 0 0 24px; overflow: hidden;">
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{ stations }}" as="s" hint-placeholder-count="4">
        <div style="flex: none; display: flex; align-items: baseline; gap: 7px;
                    padding: 8px 13px; border: 1px solid {{t.rule}}; border-radius: 999px;">
          <span style="font-size: 12px; color: {{t.muted}};">{{ s.name }}</span>
          <span class="num" style="font-size: 14px; color: {{ s.color }};">{{ s.aqi }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- nav -->
  <div style="display: flex; border-top: 1px solid {{t.rule}}; padding: 10px 8px 22px;">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
                  padding: 8px 0; color: {{ n.color }};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="{{ n.icon }}"></path>
        </svg>
        <span style="font-size: 10.5px; font-weight: {{ n.weight }};">{{ n.label }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 0, dark: null };
  }

  bandFor(v, dark) {
    const bands = [
      { max: 50,   label: 'Good',         light: '#2E7D4F', dark: '#4FA873' },
      { max: 100,  label: 'Satisfactory', light: '#6B9A2E', dark: '#93BF47' },
      { max: 200,  label: 'Moderate',     light: '#D4881A', dark: '#E5A63F' },
      { max: 300,  label: 'Poor',         light: '#DB5F22', dark: '#EA7B42' },
      { max: 400,  label: 'Very Poor',    light: '#C32A22', dark: '#DE5049' },
      { max: 9999, label: 'Severe',       light: '#7B1D57', dark: '#B85088' },
    ];
    const b = bands.find((x) => v <= x.max);
    return { label: b.label, color: dark ? b.dark : b.light };
  }

  /* Semicircular scale, 0 on the left through 500 on the right. */
  point(v, r) {
    const a = Math.PI * (1 - Math.min(v, 500) / 500);
    return { x: 140 + r * Math.cos(a), y: 150 - r * Math.sin(a) };
  }

  arc(v1, v2, r) {
    const p1 = this.point(v1, r), p2 = this.point(v2, r);
    return 'M ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
           ' A ' + r + ' ' + r + ' 0 0 1 ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
  }

  renderVals() {
    const dark = this.state.dark === null ? (this.props.dark ?? false) : this.state.dark;
    const ICON = {
      mask:    'M3 11c0-2 1-3 3-3.5 2-.5 4-1 6-1s4 .5 6 1c2 .5 3 1.5 3 3.5 0 4-4 8-9 8s-9-4-9-8z M8 12h8',
      window:  'M4 4h16v16H4z M12 4v16 M4 12h16',
      people:  'M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1 M12.5 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0z M21 20v-1a4 4 0 0 0-3-3.9 M16.5 4.1a4 4 0 0 1 0 5.8',
      purify:  'M3 8h12a3 3 0 1 0-3-3 M3 16h9a3 3 0 1 1-3 3 M3 12h16',
      medical: 'M12 8v8 M8 12h8 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
      ban:     'M4.9 4.9l14.2 14.2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
    };
    /* Precautions return above 200 — the reading where the advice stops being
       "sensitive groups take care" and starts applying to everyone. */
    const warningsFor = (v) => {
      if (v <= 200) return [];
      const w = [
        { icon: ICON.mask,   text: 'Wear an N95 mask outdoors — a cloth mask will not filter this.' },
        { icon: ICON.window, text: 'Keep windows and doors closed, especially in the evening.' },
        { icon: ICON.people, text: 'Children, elderly and pregnant women should stay indoors.' },
      ];
      if (v > 300) w.push(
        { icon: ICON.purify,  text: 'Run an air purifier, or sit in one room with the doors shut.' },
        { icon: ICON.medical, text: 'Seek medical help for breathing trouble, chest pain or dizziness.' });
      if (v > 400) w.push(
        { icon: ICON.ban, text: 'No outdoor activity at all. This is a health emergency.' });
      return w;
    };


    const t = dark
      ? { bg: '#14120F', card: '#1D1A16', ink: '#F2EDE4', muted: '#9A9186',
          faint: '#5D564D', rule: '#2E2A24',
          themeIcon: 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z' }
      : { bg: '#FAF7F1', card: '#FFFDF9', ink: '#1B1815', muted: '#6E675C',
          faint: '#ADA496', rule: '#E7E0D4',
          themeIcon: 'M12 4v2m0 12v2M4 12H2m20 0h-2M6.3 6.3 4.9 4.9m14.2 1.4 1.4-1.4M6.3 17.7l-1.4 1.4m14.2-1.4 1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z' };

    /* Real values: September's mean of 102.9 scaled by this project's
       day factors for 13-19 Sep. */
    const raw = [
      { label: 'Sun', aqi: 96 }, { label: 'Mon', aqi: 98 }, { label: 'Tue', aqi: 98 },
      { label: 'Wed', aqi: 101 }, { label: 'Thu', aqi: 99 }, { label: 'Fri', aqi: 98 },
      { label: 'Sat', aqi: 102 },
    ];
    const sel = this.state.day;
    const days = raw.map((d, i) => {
      const b = this.bandFor(d.aqi, dark);
      const on = i === sel;
      return {
        ...d, color: b.color,
        barH: Math.round(18 + (d.aqi / 500) * 120) + 'px',
        barOp: on ? '1' : '0.42',
        selBg: on ? (dark ? 'rgba(242,237,228,0.06)' : 'rgba(27,24,21,0.045)') : 'transparent',
        labelColor: on ? t.ink : t.muted,
        numColor: on ? t.ink : t.muted,
        pick: () => this.setState({ day: i }),
      };
    });

    const value = raw[sel].aqi;
    const band = this.bandFor(value, dark);

    const bounds = [0, 50, 100, 200, 300, 400, 500];
    const segs = [];
    for (let i = 0; i < 6; i++) {
      const b = this.bandFor(bounds[i] + 1, dark);
      segs.push({
        d: this.arc(bounds[i] + 3, bounds[i + 1] - 3, 112),
        color: b.color,
        op: bounds[i] < value && value <= bounds[i + 1] ? '1' : '0.22',
      });
    }

    const inner = this.point(value, 99), outer = this.point(value, 124);
    const on = this.point(value, 112);

    const advice = value <= 100
      ? 'A good week to be outside. Morning air is at its cleanest — take the long way round.'
      : value <= 200
        ? 'Fine before nine. Keep long walks short after that, especially for children and anyone with asthma.'
        : 'Stay in today. The air is serious, and it does not ease until Thursday.';

    const warnings = warningsFor(value);

    return {
      t, value, band, segs, days, advice,
      warnings, hasWarnings: warnings.length > 0,
      warnHead: 'What to do at ' + band.label.toLowerCase() + ' levels',
      mark: { x1: inner.x.toFixed(1), y1: inner.y.toFixed(1),
              x2: outer.x.toFixed(1), y2: outer.y.toFixed(1),
              cx: on.x.toFixed(1), cy: on.y.toFixed(1) },
      basis: 'Sunday 13 September · modelled from 1,916 daily readings, 2020–2025',
      stations: [
        { name: 'Anand Vihar', aqi: 112, color: this.bandFor(112, dark).color },
        { name: 'R.K. Puram', aqi: 94, color: this.bandFor(94, dark).color },
        { name: 'Dwarka', aqi: 88, color: this.bandFor(88, dark).color },
        { name: 'ITO', aqi: 103, color: this.bandFor(103, dark).color },
      ],
      nav: [
        { label: 'Today', color: t.ink, weight: '600', icon: 'M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z' },
        { label: 'Forecast', color: t.muted, weight: '500', icon: 'M3 16h5m-5 4h9M6 12a4 4 0 0 1 .8-7.9 5.5 5.5 0 0 1 10.4 1.4A3.8 3.8 0 0 1 20 12' },
        { label: 'Ask', color: t.muted, weight: '500', icon: 'M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1 1 21 12z' },
        { label: 'Patterns', color: t.muted, weight: '500', icon: 'M4 19V9m5 10V5m5 14v-7m5 7V8' },
      ],
      toggleDark: () => this.setState({ dark: !dark }),
    };
  }
}
</script>
</body>
</html>
