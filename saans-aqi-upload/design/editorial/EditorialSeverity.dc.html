<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F5241; } a:hover { color: #143A2E; }
    .num { font-family: 'Instrument Serif', Georgia, serif; font-variant-numeric: tabular-nums; }
    .body { font-family: 'Karla', 'Helvetica Neue', sans-serif; }
    .eyebrow { font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 600;
               letter-spacing: 0.14em; text-transform: uppercase; }
  </style>
</helmet>

<div class="body" style="width: 1160px; height: 640px; background: {{t.bg}}; color: {{t.ink}};
            padding: 44px 40px; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="margin-bottom: 8px;">
    <div class="eyebrow" style="color: {{t.muted}};">Severity states</div>
    <p class="num" style="margin: 10px 0 0; font-size: 25px; line-height: 1.35; max-width: 720px;
              text-wrap: pretty;">The screen should change character with the air, not just change a
      number. Tone, weight and the amount of colour shift as the reading worsens — and above 200 the explicit precautions come back.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px;
              margin-top: 34px;">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
      <div style="background: {{ c.cardBg }}; border: 1px solid {{ c.cardLine }}; border-radius: 4px;
                  padding: 30px 28px 26px; display: flex; flex-direction: column; align-items: center;">
        <svg width="240" height="146" viewBox="0 0 280 168" style="display: block;">
          <sc-for list="{{ c.segs }}" as="seg" hint-placeholder-count="6">
            <path d="{{seg.d}}" fill="none" stroke="{{seg.color}}" stroke-width="7"
                  stroke-linecap="butt" opacity="{{seg.op}}"></path>
          </sc-for>
          <line x1="{{ c.mark.x1 }}" y1="{{ c.mark.y1 }}" x2="{{ c.mark.x2 }}" y2="{{ c.mark.y2 }}"
                stroke="{{ c.color }}" stroke-width="2.5" stroke-linecap="round"></line>
          <circle cx="{{ c.mark.cx }}" cy="{{ c.mark.cy }}" r="5.5" fill="{{ c.cardBg }}"
                  stroke="{{ c.color }}" stroke-width="2.5"></circle>
        </svg>
        <div class="num" style="font-size: 64px; line-height: 0.86; margin-top: -84px;
                    color: {{ c.numColor }};">{{ c.aqi }}</div>
        <div class="eyebrow" style="color: {{ c.color }}; margin-top: 12px;">{{ c.label }}</div>
        <div style="height: 1px; width: 100%; background: {{ c.cardLine }}; margin: 24px 0 18px;"></div>
        <p class="num" style="margin: 0; font-size: 17px; line-height: 1.45; text-align: center;
                  color: {{ c.adviceColor }}; text-wrap: pretty;">{{ c.advice }}</p>

        <sc-if value="{{ c.hasWarnings }}" hint-placeholder-val="{{ true }}">
          <div style="width: 100%; margin-top: 22px; border: 1px solid {{ c.cardLine }};
                      border-radius: 4px; overflow: hidden;">
            <div class="eyebrow" style="padding: 12px 15px 10px; color: {{ c.color }};
                        border-bottom: 1px solid {{ c.cardLine }};">{{ c.warnHead }}</div>
            <sc-for list="{{ c.warnings }}" as="w" hint-placeholder-count="3">
              <div style="display: flex; align-items: flex-start; gap: 11px; padding: 11px 15px;
                          border-top: 1px solid {{ c.warnLine }};">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{ c.color }}"
                     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
                     style="flex: none; margin-top: 1px;"><path d="{{ w.icon }}"></path></svg>
                <span style="font-size: 12.5px; line-height: 1.45;">{{ w.text }}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  point(v, r) {
    const a = Math.PI * (1 - Math.min(v, 500) / 500);
    return { x: 140 + r * Math.cos(a), y: 150 - r * Math.sin(a) };
  }
  arc(v1, v2, r) {
    const p1 = this.point(v1, r), p2 = this.point(v2, r);
    return 'M ' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
           ' A ' + r + ' ' + r + ' 0 0 1 ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#14120F', ink: '#F2EDE4', muted: '#9A9186', rule: '#2E2A24' }
      : { bg: '#FAF7F1', ink: '#1B1815', muted: '#6E675C', rule: '#E7E0D4' };

    const bands = [
      { max: 50, label: 'Good', light: '#2E7D4F', dark: '#4FA873' },
      { max: 100, label: 'Satisfactory', light: '#6B9A2E', dark: '#93BF47' },
      { max: 200, label: 'Moderate', light: '#D4881A', dark: '#E5A63F' },
      { max: 300, label: 'Poor', light: '#DB5F22', dark: '#EA7B42' },
      { max: 400, label: 'Very Poor', light: '#C32A22', dark: '#DE5049' },
      { max: 9999, label: 'Severe', light: '#7B1D57', dark: '#B85088' },
    ];
    const bandFor = (v) => {
      const b = bands.find((x) => v <= x.max);
      return { label: b.label, color: dark ? b.dark : b.light };
    };

    const ICON = {
      mask:    'M3 11c0-2 1-3 3-3.5 2-.5 4-1 6-1s4 .5 6 1c2 .5 3 1.5 3 3.5 0 4-4 8-9 8s-9-4-9-8z M8 12h8',
      window:  'M4 4h16v16H4z M12 4v16 M4 12h16',
      people:  'M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1 M12.5 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0z M21 20v-1a4 4 0 0 0-3-3.9 M16.5 4.1a4 4 0 0 1 0 5.8',
      purify:  'M3 8h12a3 3 0 1 0-3-3 M3 16h9a3 3 0 1 1-3 3 M3 12h16',
      medical: 'M12 8v8 M8 12h8 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
      ban:     'M4.9 4.9l14.2 14.2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z',
    };
    /* Precautions return above 200 — the reading where the advice stops being
       "sensitive groups take care" and starts applying to everyone. */
    const warningsFor = (v) => {
      if (v <= 200) return [];
      const w = [
        { icon: ICON.mask,   text: 'Wear an N95 mask outdoors — a cloth mask will not filter this.' },
        { icon: ICON.window, text: 'Keep windows and doors closed, especially in the evening.' },
        { icon: ICON.people, text: 'Children, elderly and pregnant women should stay indoors.' },
      ];
      if (v > 300) w.push(
        { icon: ICON.purify,  text: 'Run an air purifier, or sit in one room with the doors shut.' },
        { icon: ICON.medical, text: 'Seek medical help for breathing trouble, chest pain or dizziness.' });
      if (v > 400) w.push(
        { icon: ICON.ban, text: 'No outdoor activity at all. This is a health emergency.' });
      return w;
    };


    /* Three readings this project actually produces: a clean September day,
       an October average, and the November forecast. */
    const source = [
      { aqi: 96, advice: 'A good week to be outside. Morning air is at its cleanest.', tint: 0 },
      { aqi: 212, advice: 'Shorten the school run. Windows shut by evening.', tint: 1 },
      { aqi: 362, advice: 'Stay in today. The air is serious, and it does not ease until Thursday.', tint: 2 },
    ];

    const cards = source.map((s) => {
      const b = bandFor(s.aqi);
      const bounds = [0, 50, 100, 200, 300, 400, 500];
      const segs = [];
      for (let i = 0; i < 6; i++) {
        segs.push({
          d: this.arc(bounds[i] + 3, bounds[i + 1] - 3, 112),
          color: bandFor(bounds[i] + 1).color,
          op: bounds[i] < s.aqi && s.aqi <= bounds[i + 1] ? '1' : '0.22',
        });
      }
      const inner = this.point(s.aqi, 99), outer = this.point(s.aqi, 124), on = this.point(s.aqi, 112);
      /* The worse the reading, the more the card itself carries the colour. */
      const washes = dark
        ? ['#1D1A16', '#281E15', '#301A17']
        : ['#FFFDF9', '#FDF2E0', '#FBE8E1'];
      const lines = dark
        ? ['#2E2A24', '#42301F', '#4E2822']
        : ['#E7E0D4', '#F1D9B4', '#F3CEC3'];
      const warnings = warningsFor(s.aqi);
      return {
        aqi: s.aqi, advice: s.advice, label: b.label, color: b.color, segs,
        warnings, hasWarnings: warnings.length > 0,
        warnHead: 'What to do at ' + b.label.toLowerCase() + ' levels',
        warnLine: dark ? '#2E2A24' : '#EFE7DA',
        cardBg: washes[s.tint], cardLine: lines[s.tint],
        numColor: s.tint === 2 ? b.color : t.ink,
        adviceColor: s.tint === 0 ? t.muted : t.ink,
        mark: { x1: inner.x.toFixed(1), y1: inner.y.toFixed(1),
                x2: outer.x.toFixed(1), y2: outer.y.toFixed(1),
                cx: on.x.toFixed(1), cy: on.y.toFixed(1) },
      };
    });

    return { t, cards };
  }
}
</script>
</body>
</html>
