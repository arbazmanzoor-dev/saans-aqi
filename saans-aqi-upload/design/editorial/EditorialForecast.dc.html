<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F5241; text-decoration: none; } a:hover { color: #143A2E; }
    .num { font-family: 'Instrument Serif', Georgia, serif; font-variant-numeric: tabular-nums; }
    .body { font-family: 'Karla', 'Helvetica Neue', sans-serif; }
    .eyebrow { font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 600;
               letter-spacing: 0.14em; text-transform: uppercase; }
    .tap { cursor: pointer; border: 0; background: none; font-family: 'Karla', sans-serif; }
  </style>
</helmet>

<div class="body" style="width: 1280px; height: 900px; background: {{t.bg}}; color: {{t.ink}};
            display: flex; flex-direction: column; overflow: hidden;">
  <!-- site header -->
  <div style="border-bottom: 1px solid {{t.rule}}; background: {{t.bg}};">
    <div style="display: flex; align-items: center; gap: 28px; height: 68px;
                width: 996px; margin: 0 auto;">
      <div style="display: flex; align-items: baseline; gap: 7px; flex: none;">
        <span class="num" style="font-size: 25px;">Saans</span>
        <span class="eyebrow" style="color: {{t.muted}};">AQI</span>
      </div>
      <div style="display: flex; gap: 2px; flex-grow: 1;">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
          <span style="padding: 8px 14px; border-radius: 999px; font-size: 13.5px;
                       font-weight: {{ n.weight }}; color: {{ n.color }};
                       background: {{ n.bg }};">{{ n.label }}</span>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; flex: none;">
        <button onClick="{{ toggleDark }}" style="width: 40px; height: 40px; border: 0;
                background: none; cursor: pointer; color: {{t.muted}}; border-radius: 999px;
                display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="{{t.themeIcon}}"></path>
          </svg>
        </button>
        <div style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid {{t.rule}};
                    display: flex; align-items: center; justify-content: center;
                    font-size: 12px; font-weight: 600; color: {{t.muted}};">A</div>
      </div>
    </div>
  </div>

  <div style="width: 996px; margin: 0 auto; padding-top: 44px;">

    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 20px;">
      <span class="num" style="font-size: 32px;">Forecast</span>
      <div style="display: flex; gap: 10px;">
        <div style="display: flex; gap: 2px; border: 1px solid {{t.rule}}; border-radius: 999px; padding: 3px;">
          <sc-for list="{{ scopes }}" as="s" hint-placeholder-count="4">
            <span style="padding: 8px 16px; border-radius: 999px; font-size: 12.5px;
                         font-weight: {{ s.weight }}; background: {{ s.bg }}; color: {{ s.color }};">{{ s.label }}</span>
          </sc-for>
        </div>
        <div style="display: flex; gap: 2px; border: 1px solid {{t.rule}}; border-radius: 999px; padding: 3px;">
          <sc-for list="{{ years }}" as="y" hint-placeholder-count="3">
            <button class="tap" onClick="{{ y.pick }}"
                    style="padding: 8px 16px; border-radius: 999px; font-size: 12.5px;
                           font-weight: {{ y.weight }}; background: {{ y.bg }}; color: {{ y.color }};">{{ y.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 36px;">
      <div class="eyebrow" style="color: {{t.muted}};">{{ heading }}</div>
      <div class="num" style="font-size: 132px; line-height: 0.84; margin-top: 14px;
                  color: {{ band.color }};">{{ value }}</div>
      <div class="eyebrow" style="margin-top: 14px;">{{ band.label }}</div>

      <div style="margin: 26px auto 0; max-width: 320px;">
        <div style="position: relative; height: 3px; background: {{t.rule}}; border-radius: 2px;">
          <div style="position: absolute; top: 0; bottom: 0; left: {{ ci.left }}; width: {{ ci.width }};
                      background: {{ band.color }}; opacity: 0.28; border-radius: 2px;"></div>
          <div style="position: absolute; top: -3px; left: {{ ci.mid }}; width: 2px; height: 9px;
                      background: {{ band.color }}; border-radius: 1px;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 9px; font-size: 11px;">
          <span style="color: {{t.faint}};">{{ ci.lo }}</span>
          <span style="color: {{t.muted}};">likely range</span>
          <span style="color: {{t.faint}};">{{ ci.hi }}</span>
        </div>
      </div>
    </div>

    <div style="margin-top: 40px;">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 150px;">
        <sc-for list="{{ months }}" as="m" hint-placeholder-count="12">
          <button class="tap" onClick="{{ m.pick }}"
                  style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <span style="display: block; width: 100%; max-width: 26px; height: {{ m.h }};
                         border-radius: 3px; background: {{ m.color }}; opacity: {{ m.op }};"></span>
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
                         color: {{ m.labelColor }};">{{ m.label }}</span>
          </button>
        </sc-for>
      </div>
      <p style="margin: 18px 0 0; font-size: 12.5px; color: {{t.muted}}; text-align: center;">Tap a
        month to read it. Bars are the modelled monthly mean.</p>
    </div>

    <div style="height: 1px; background: {{t.rule}}; margin-top: 40px;"></div>
    <p class="num" style="margin: 22px 0 0; font-size: 19px; line-height: 1.45; text-wrap: pretty;">{{ note }}</p>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { month: 10, year: 1, dark: null }; }

  bandFor(v, dark) {
    const bands = [
      { max: 50,   label: 'Good',         light: '#2E7D4F', dark: '#4FA873' },
      { max: 100,  label: 'Satisfactory', light: '#6B9A2E', dark: '#93BF47' },
      { max: 200,  label: 'Moderate',     light: '#D4881A', dark: '#E5A63F' },
      { max: 300,  label: 'Poor',         light: '#DB5F22', dark: '#EA7B42' },
      { max: 400,  label: 'Very Poor',    light: '#C32A22', dark: '#DE5049' },
      { max: 9999, label: 'Severe',       light: '#7B1D57', dark: '#B85088' },
    ];
    const b = bands.find((x) => v <= x.max);
    return { label: b.label, color: dark ? b.dark : b.light };
  }

  theme(dark) {
    return dark
      ? { bg: '#14120F', card: '#1D1A16', ink: '#F2EDE4', muted: '#9A9186',
          faint: '#5D564D', rule: '#2E2A24', sel: 'rgba(242,237,228,0.06)', accent: '#7FB39E',
          themeIcon: 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z' }
      : { bg: '#FAF7F1', card: '#FFFDF9', ink: '#1B1815', muted: '#6E675C',
          faint: '#ADA496', rule: '#E7E0D4', sel: 'rgba(27,24,21,0.045)', accent: '#1F5241',
          themeIcon: 'M12 4v2m0 12v2M4 12H2m20 0h-2M6.3 6.3 4.9 4.9m14.2 1.4 1.4-1.4M6.3 17.7l-1.4 1.4m14.2-1.4 1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z' };
  }

  navFor(t, active) {
    return ['Today','Forecast','Ask','Patterns'].map((label) => ({
      label,
      color: label === active ? t.ink : t.muted,
      weight: label === active ? '600' : '500',
      bg: label === active ? t.sel : 'transparent',
    }));
  }


  renderVals() {
    const dark = this.state.dark === null ? (this.props.dark ?? false) : this.state.dark;
    const t = this.theme(dark);

    /* Straight from the app's ml_lookup table. */
    const table = {
      2025: [272, 190, 160, 122, 128, 119, 92, 94, 96, 169, 302, 206],
      2026: [324, 240, 194, 204, 191, 163, 94, 97, 100, 212, 362, 326],
      2027: [322, 240, 194, 204, 191, 163, 94, 97, 100, 212, 362, 326],
    };
    const yearList = [2025, 2026, 2027];
    const year = yearList[this.state.year];
    const vals = table[year];
    const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const full = ['January','February','March','April','May','June','July','August',
                  'September','October','November','December'];

    const sel = this.state.month;
    const value = vals[sel];
    const band = this.bandFor(value, dark);
    const peak = Math.max.apply(null, vals);
    const spread = Math.round(value * 0.184 * 1.96);
    const lo = Math.max(0, value - spread), hi = value + spread;
    const pct = (v) => (v/500)*100;

    return {
      t, value, band,
      heading: full[sel] + ' ' + year,
      months: vals.map((v, i) => ({
        label: names[i],
        h: Math.round(18 + (v/peak)*126) + 'px',
        color: this.bandFor(v, dark).color,
        op: i === sel ? '1' : '0.3',
        labelColor: i === sel ? t.ink : t.faint,
        pick: () => this.setState({ month: i }),
      })),
      years: yearList.map((y, i) => ({
        label: String(y),
        bg: i === this.state.year ? t.ink : 'transparent',
        color: i === this.state.year ? t.bg : t.muted,
        weight: i === this.state.year ? '600' : '500',
        pick: () => this.setState({ year: i }),
      })),
      scopes: ['Month','Day','Week','Year'].map((label) => ({
        label,
        bg: label === 'Month' ? t.ink : 'transparent',
        color: label === 'Month' ? t.bg : t.muted,
        weight: label === 'Month' ? '600' : '500',
      })),
      ci: { lo, hi, left: pct(lo).toFixed(1) + '%',
            width: (pct(hi)-pct(lo)).toFixed(1) + '%', mid: pct(value).toFixed(1) + '%' },
      note: sel === 10
        ? 'November is the worst month of the Delhi year, every year on record here — roughly four times August.'
        : 'Modelled from the seasonal shape of the last five complete years, held against a flat level trend.',
      nav: this.navFor(t, 'Forecast'),
      toggleDark: () => this.setState({ dark: !dark }),
    };
  }
}
</script>
</body>
</html>
